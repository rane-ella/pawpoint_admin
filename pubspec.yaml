name: pawpoint_admin
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  google_fonts: ^6.2.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  http: ^1.6.0
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/pawlogo.jpg"
  min_sdk_android: 21
